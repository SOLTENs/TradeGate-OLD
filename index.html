<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TradeGate</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;500;700;900&display=swap');

*{-webkit-box-sizing:border-box;box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0a0c;color:#e8e8f0;font-family:'Barlow Condensed',sans-serif;min-height:100vh;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;overflow-x:hidden;}
#app{width:100%;max-width:480px;min-height:100vh;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;padding:0 0 32px;}
.topbar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid #1e1e28;position:-webkit-sticky;position:sticky;top:0;background:#0a0a0c;z-index:10;}
.topbar-logo{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.15em;color:#44445a;text-transform:uppercase;}
.reset-btn{background:transparent;border:1px solid #1e1e28;color:#44445a;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:6px 12px;cursor:pointer;-webkit-appearance:none;border-radius:0;}
.progress-bar{height:2px;background:#1e1e28;width:100%;}
.progress-fill{height:100%;background:#c8ff00;-webkit-transition:width 0.4s;transition:width 0.4s;}
.screen{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;padding:32px 20px 20px;min-height:calc(100vh - 60px);}
.step-label{font-family:'Space Mono',monospace;font-size:10px;color:#44445a;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:8px;}
.screen-title{font-size:40px;font-weight:900;letter-spacing:0.02em;line-height:1;text-transform:uppercase;color:#e8e8f0;margin-bottom:36px;}
.btn-grid{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:8px;}
.option-btn{background:#111116;border:1px solid #1e1e28;color:#e8e8f0;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:500;letter-spacing:0.03em;padding:16px 20px;text-align:left;cursor:pointer;width:100%;-webkit-appearance:none;border-radius:0;}
.option-btn.selected-green{background:rgba(0,232,122,0.12);border-color:#00e87a;color:#00e87a;}
.option-btn.selected-yellow{background:rgba(255,204,0,0.1);border-color:#ffcc00;color:#ffcc00;}
.option-btn.danger-btn{color:#ff4455;border-color:rgba(255,68,85,0.3);}
.yesno-grid{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:10px;-webkit-flex:1;flex:1;}
.yn-btn{border:1px solid #1e1e28;background:#111116;color:#e8e8f0;font-family:'Barlow Condensed',sans-serif;font-size:48px;font-weight:700;letter-spacing:0.08em;text-align:center;cursor:pointer;text-transform:uppercase;-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-appearance:none;border-radius:0;width:100%;}
.next-btn{margin-top:20px;background:#c8ff00;color:#0a0a0c;border:none;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;padding:18px;cursor:pointer;width:100%;-webkit-appearance:none;border-radius:0;}
.semmi-btn{background:transparent;border:1px solid #1e1e28;color:#44445a;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:500;letter-spacing:0.06em;padding:14px 20px;cursor:pointer;text-align:left;width:100%;-webkit-appearance:none;border-radius:0;}
.skip-btn{margin-top:20px;background:#111116;color:#e8e8f0;border:1px solid #1e1e28;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:18px;cursor:pointer;width:100%;-webkit-appearance:none;border-radius:0;}
.divider{border:none;border-top:1px solid #1e1e28;margin:10px 0;}
.setup-container{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:12px;}
.setup-block{border:1px solid #1e1e28;overflow:hidden;}
.setup-block.open{border-color:#c8ff00;}
.setup-header{background:#111116;padding:20px;cursor:pointer;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;font-size:22px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;width:100%;border:none;text-align:left;color:#e8e8f0;-webkit-appearance:none;border-radius:0;}
.setup-block.open .setup-header{color:#c8ff00;}
.chevron{font-size:14px;color:#44445a;font-family:'Space Mono',monospace;display:inline-block;}
.setup-list{display:none;-webkit-flex-direction:column;flex-direction:column;border-top:1px solid #1e1e28;}
.setup-block.open .setup-list{display:-webkit-flex;display:flex;}
.setup-item{padding:12px 20px;font-size:17px;font-weight:400;letter-spacing:0.02em;color:#44445a;border-bottom:1px solid #1e1e28;}
.setup-item:last-child{border-bottom:none;}
.allowed-screen{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:40px 20px;text-align:center;}
.allowed-title{font-size:56px;font-weight:900;letter-spacing:0.02em;line-height:1;text-transform:uppercase;color:#c8ff00;margin-bottom:12px;}
.allowed-subtitle{font-size:24px;font-weight:300;color:#44445a;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:48px;}
.allowed-reset{background:transparent;border:1px solid #1e1e28;color:#44445a;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;padding:14px 32px;cursor:pointer;margin-top:10px;-webkit-appearance:none;border-radius:0;}
#not-allowed-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0c;z-index:100;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center;}
#not-allowed-overlay.visible{display:-webkit-flex;display:flex;}
.not-allowed-x{font-size:180px;font-weight:900;color:#ff4455;line-height:1;}
.not-allowed-text{font-family:'Space Mono',monospace;font-size:20px;letter-spacing:0.22em;text-transform:uppercase;color:#ff4455;margin-top:28px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="topbar-logo">TradeGate</span>
    <button class="reset-btn" onclick="reset()">Reset</button>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress" style="width:0%"></div>
  </div>
  <div id="screens"></div>
  <div id="not-allowed-overlay">
    <div class="not-allowed-x">&#10007;</div>
    <div class="not-allowed-text">Trade Not Allowed</div>
  </div>
</div>
<script>
var SCREENS = [
  {
    id: 1,
    title: "HTF POI",
    type: "multi-select-s1",
    options: ["kis-k z\u00f3na","momentum kiindul\u00e1si z\u00f3na","nyit\u00f3 z\u00f3na","flip z\u00f3na","anti-z\u00f3na","likvidit\u00e1s s\u00f6pr\u00e9s","iv","iv let\u00f6r\u00e9s","STF K t\u00f6r\u00e9s","HTF setup","MOC","W MOC"],
    _unused: 0
  },
  {
    id: 2,
    title: "VAN HELY?",
    type: "yesno",
    _unused: 0
  },
  {
    id: 3,
    title: "EXTRA T\u00c1MOGAT\u00d3 K\u00d6R\u00dcLM\u00c9NY",
    type: "multi-select",
    options: ["cs\u00fazli","cs\u00fazli behal\u00e1sa","gyorusl\u00e1s","P3","kontra setup behal\u00e1sa","1. trendp\u00e1rna meggy\u0171r\u00e9s","Polarit\u00e1s v\u00e1lt\u00e1s","Choch","kis-k t\u00f6r\u00e9s","BOF","STF K t\u00f6r\u00e9s","\u25b3 + kit\u00f6r\u00e9s ut\u00e1n kontra","nincs"],
    noneOption: "nincs",
    _unused: 0
  },
  {
    id: 4,
    title: "MI SZ\u00d3L A K\u00d6T\u00c9S ELLEN?",
    type: "mixed",
    dangerOptions: ["gyorsul\u00e1s vel\u00fcnk szemben","P3","HTF Z\u00d3NA","k\u00e9sei RSI cross","\u25b3 + kit\u00f6r\u00e9s ut\u00e1n trendir\u00e1nyba","cs\u00fazli","cs\u00fazli behal\u00e1sa"],
    yellowOptions: ["trenddel szemben","Korrekci\u00f3k m\u00e9ret\u00e9nek n\u00f6veked\u00e9se = ue","HTF Z\u00d3NA"],
    _unused: 0
  },
  {
    id: 5,
    title: "\u00c9RZELMI K\u00d6T\u00c9S?",
    type: "emotional",
    dangerOptions: ["NEHOGY KIMARADJAK!!!","MUSZ\u00c1J NYERNEM!!!","TUDOM MI LESZ!!!"],
    skipOption: "SKIP? OK!",
    _unused: 0
  }
];
var primaryItems = ["1-2","W5","K2k","DKk","C","MOC","W MOC","\u00d6reg trendp\u00e1rna meggy\u0171r\u0151d\u00e9s + BOF","Korai gy\u0171r\u0151d\u00e9s + Kk + (C1 cross + k)"];
var secondaryItems = ["RUNNING FLAT","I-AVGH","FLAT-C","NPKP","NPNP","Dk","k2'","sdiv","ss+"];

var currentScreen    = 1;
var screen1Sel       = {};
var screen3Sel       = {};
var screen4YellowSel = {};
var screen4YellowNext= false;
var screen4SemmiDone = false;
var s6PrimaryOpen    = false;
var s6SecondaryOpen  = false;

function hasKey(obj) {
  for (var k in obj) { if (obj.hasOwnProperty(k)) return true; }
  return false;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function goTo(n) { currentScreen = n; render(); }

function reset() {
  currentScreen = 1;
  screen1Sel = {}; screen3Sel = {};
  screen4YellowSel = {}; screen4YellowNext = false;
  screen4SemmiDone = false;
  s6PrimaryOpen = false; s6SecondaryOpen = false;
  render();
}

function updateProgress(step, total) {
  var pct = step === 0 ? 0 : Math.round(step / total * 100);
  document.getElementById('progress').style.width = pct + '%';
}

function render() {
  var container = document.getElementById('screens');
  updateProgress(currentScreen - 1, SCREENS.length);

  if (currentScreen > SCREENS.length) {
    updateProgress(SCREENS.length, SCREENS.length);
    var priHtml = '';
    for (var i = 0; i < primaryItems.length; i++) {
      priHtml += '<div class="setup-item">' + primaryItems[i] + '</div>';
    }
    var secHtml = '';
    for (var i = 0; i < secondaryItems.length; i++) {
      secHtml += '<div class="setup-item">' + secondaryItems[i] + '</div>';
    }
    container.innerHTML =
      '<div class="allowed-screen">'
      + '<div class="allowed-title">TRADE</div>'
      + '<div class="allowed-title" style="color:#e8e8f0;">ALLOWED</div>'
      + '<div class="allowed-subtitle">Mehet a k&#246;t&#233;s</div>'
      + '<div class="setup-container" style="width:100%;margin-top:28px;text-align:left;">'
      +   '<div class="setup-block' + (s6PrimaryOpen ? ' open' : '') + '">'
      +     '<button class="setup-header" onclick="toggleSetup(\'primary\')">'
      +       '<span>PRIMARY SETUP</span><span class="chevron">&#9660;</span>'
      +     '</button>'
      +     '<div class="setup-list">' + priHtml + '</div>'
      +   '</div>'
      +   '<div class="setup-block' + (s6SecondaryOpen ? ' open' : '') + '">'
      +     '<button class="setup-header" onclick="toggleSetup(\'secondary\')">'
      +       '<span>SECONDARY SETUP</span><span class="chevron">&#9660;</span>'
      +     '</button>'
      +     '<div class="setup-list">' + secHtml + '</div>'
      +   '</div>'
      + '</div>'
      + '<button class="allowed-reset" onclick="reset()">Visszaall&#237;t&#225;s</button>'
      + '</div>';
    return;
  }

  var s = SCREENS[currentScreen - 1];
  var html = '<div class="screen">'
    + '<div class="step-label">' + currentScreen + ' / ' + SCREENS.length + '</div>'
    + '<div class="screen-title">' + s.title + '</div>';

  if (s.type === 'multi-select-s1') {
    html += '<div class="btn-grid">';
    for (var i = 0; i < s.options.length; i++) {
      var opt = s.options[i];
      var cls = screen1Sel[opt] ? 'option-btn selected-green' : 'option-btn';
      html += '<button class="' + cls + '" onclick="s1toggle(\'' + esc(opt) + '\')">' + opt + '</button>';
    }
    html += '</div>';
    if (hasKey(screen1Sel)) {
      html += '<button class="next-btn" onclick="goTo(2)">Tov&#225;bb</button>';
    }
  }

  else if (s.type === 'yesno') {
    html += '<div class="yesno-grid">'
      + '<button class="yn-btn yes" onclick="goTo(3)">igen</button>'
      + '<button class="yn-btn no" onclick="showNotAllowed()">nem</button>'
      + '</div>';
  }

  else if (s.type === 'multi-select') {
    html += '<div class="btn-grid">';
    for (var i = 0; i < s.options.length; i++) {
      var opt = s.options[i];
      if (opt === s.noneOption) continue;
      var cls = screen3Sel[opt] ? 'option-btn selected-green' : 'option-btn';
      html += '<button class="' + cls + '" onclick="s3toggle(\'' + esc(opt) + '\')">' + opt + '</button>';
    }
    html += '</div>';
    html += '<hr class="divider">';
    html += '<button class="semmi-btn" onclick="s3none()">nincs</button>';
    if (hasKey(screen3Sel) && !screen3Sel['nincs']) {
      html += '<button class="next-btn" onclick="goTo(4)">Tov&#225;bb</button>';
    }
  }

  else if (s.type === 'mixed') {
    html += '<div class="btn-grid">';
    for (var i = 0; i < s.dangerOptions.length; i++) {
      html += '<button class="option-btn danger-btn" onclick="showNotAllowed()">' + s.dangerOptions[i] + '</button>';
    }
    html += '<hr class="divider">';
    for (var i = 0; i < s.yellowOptions.length; i++) {
      var opt = s.yellowOptions[i];
      var cls = screen4YellowSel[opt] ? 'option-btn selected-yellow' : 'option-btn';
      html += '<button class="' + cls + '" onclick="s4yellow(\'' + esc(opt) + '\')">' + opt + '</button>';
    }
    html += '<hr class="divider">';
    html += '<button class="semmi-btn" onclick="s4none()">semmi</button>';
    html += '</div>';
    if (screen4YellowNext) {
      html += '<button class="next-btn" onclick="goTo(5)">Tov&#225;bb</button>';
    }
  }

  else if (s.type === 'emotional') {
    html += '<div class="btn-grid">';
    for (var i = 0; i < s.dangerOptions.length; i++) {
      html += '<button class="option-btn danger-btn" onclick="showNotAllowed()">' + s.dangerOptions[i] + '</button>';
    }
    html += '</div>';
    html += '<button class="skip-btn" onclick="goTo(7)">' + s.skipOption + '</button>';
  }

  html += '</div>';
  container.innerHTML = html;
}

function s1toggle(opt) {
  if (screen1Sel[opt]) { delete screen1Sel[opt]; } else { screen1Sel[opt] = true; }
  render();
}

function s3toggle(opt) {
  if (screen3Sel[opt]) { delete screen3Sel[opt]; } else { screen3Sel[opt] = true; }
  render();
}

function s3none() {
  screen3Sel = { 'nincs': true };
  goTo(4);
}

function s4yellow(opt) {
  if (screen4YellowSel[opt]) { delete screen4YellowSel[opt]; } else { screen4YellowSel[opt] = true; }
  screen4YellowNext = hasKey(screen4YellowSel);
  render();
}

function s4none() {
  screen4YellowSel = {};
  screen4YellowNext = false;
  screen4SemmiDone = true;
  goTo(5);
}

function showNotAllowed() {
  var el = document.getElementById('not-allowed-overlay');
  el.className = 'visible';
  setTimeout(function() { el.className = ''; reset(); }, 2000);
}

function toggleSetup(which) {
  if (which === 'primary') { s6PrimaryOpen = !s6PrimaryOpen; }
  else { s6SecondaryOpen = !s6SecondaryOpen; }
  render();
}

reset();
</script>
</body>
</html>
